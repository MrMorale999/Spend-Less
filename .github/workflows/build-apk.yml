name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Imposta Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installa dipendenze e sincronizza Capacitor
        run: |
          rm -rf node_modules
          npm install
          npx cap sync android

      - name: Imposta Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Dai permessi a Gradle
        run: chmod +x android/gradlew

      - name: Compila APK Debug
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Carica APK pronto
        uses: actions/upload-artifact@v4
        with:
          name: SpendiSmart-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk