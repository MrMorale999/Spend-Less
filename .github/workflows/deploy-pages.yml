name: Deploy Web App su GitHub Pages

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Scarica codice
        uses: actions/checkout@v4
      - name: Prepara cartella www
        uses: actions/upload-pages-artifact@v3
        with:
          path: './www'
      - name: Pubblica su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4